version: '3.8' 

services:
  # 1. Backend servisi (Django)
  backend:
    build: . 
    container_name: homesecurity_backend
    working_dir: /app/app # Django proje dizini, karmaşa olmasın diye /app/app yaptık
    command: python manage.py runserver 0.0.0.0:8000  # Django sunucusunu başlatmak için, sleep infinity uyutuyor
    volumes:
      - ./app:/app/app  
    ports:
      - "8000:8000" 
    env_file:
      - .env 
    depends_on:
      - db 
  redis:
    image: redis:7-alpine
    container_name: homesecurity_redis
    ports:
      - "6379:6379"
    restart: always
  # 2. Veritabanı (PostgreSQL 16) 
  db:
    image: postgres:16-alpine #Alpine linux tabanlı, 16 sürümü debian tabanlı. kısaca alpine daha hafif
    container_name: homesecurity_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0 # Güncel ve stabil bir sürüm
    container_name: homesecurity_keycloak
    environment:
      KC_DB: postgres # Keycloak da verilerini bizim PostgreSQL'de tutacak
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: keycloak_db # Keycloak için ayrı bir mantıksal veritabanı adı
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: admin # Keycloak Paneline giriş için admin kullanıcı adı
      KEYCLOAK_ADMIN_PASSWORD: admin # Keycloak Paneline giriş için admin şifresi
    ports:
      - "8080:8080" # Keycloak web paneli bu portta çalışacak
    command: start-dev # Geliştirme modu için
    depends_on:
      - db

volumes:
  postgres_data: